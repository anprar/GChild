name: Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/companion-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/companion-android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # android-actions/setup-android@v3 gagal karena memanggil paket 'tools' yang
      # sudah tidak ada. Runner GitHub sudah membawa cmdline-tools; pakai langsung.
      - name: Install Android SDK platform 37 dan build tools
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager tidak ditemukan di $ANDROID_HOME"; exit 1
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          # Platform stabil Android 17 dirilis sebagai versi minor (android-37.2),
          # jadi "platforms;android-37" tidak pernah ada. Versi minor dinyatakan
          # di Gradle lewat compileSdkMinor = 2.
          "$SDKM" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
          echo "platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Unit test JVM
        run: gradle --no-daemon -p apps/companion-android :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon -p apps/companion-android :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gchild-companion-debug
          path: apps/companion-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release APK (signed bila secret tersedia)
        env:
          GCHILD_KEYSTORE_BASE64: ${{ secrets.GCHILD_KEYSTORE_BASE64 }}
          GCHILD_KEYSTORE_PASSWORD: ${{ secrets.GCHILD_KEYSTORE_PASSWORD }}
          GCHILD_KEY_ALIAS: ${{ secrets.GCHILD_KEY_ALIAS }}
          GCHILD_KEY_PASSWORD: ${{ secrets.GCHILD_KEY_PASSWORD }}
          GCHILD_API_BASE_URL: ${{ vars.GCHILD_API_BASE_URL }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${GCHILD_API_BASE_URL:-}" ]; then
            ARGS+=("-Pgchild.apiBaseUrl=${GCHILD_API_BASE_URL}")
          fi
          if [ -n "${GCHILD_KEYSTORE_BASE64:-}" ] \
            && [ -n "${GCHILD_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${GCHILD_KEY_ALIAS:-}" ] \
            && [ -n "${GCHILD_KEY_PASSWORD:-}" ]; then
            export GCHILD_KEYSTORE_PATH="$RUNNER_TEMP/gchild-release.jks"
            printf '%s' "$GCHILD_KEYSTORE_BASE64" | base64 -d > "$GCHILD_KEYSTORE_PATH"
            echo "Keystore release tersedia; APK akan ditandatangani."
          else
            echo "Keystore tidak lengkap: APK release dibangun tanpa signing."
          fi
          gradle --no-daemon -p apps/companion-android "${ARGS[@]}" :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gchild-companion-release
          path: apps/companion-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
