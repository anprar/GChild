name: Android Companion

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/companion-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/companion-android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 37 dan build tools
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Unit test dan debug APK
        run: >-
          gradle --no-daemon -p apps/companion-android
          :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gchild-companion-debug
          path: apps/companion-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Release APK (signed bila secret tersedia)
        env:
          GCHILD_KEYSTORE_BASE64: ${{ secrets.GCHILD_KEYSTORE_BASE64 }}
          GCHILD_KEYSTORE_PASSWORD: ${{ secrets.GCHILD_KEYSTORE_PASSWORD }}
          GCHILD_KEY_ALIAS: ${{ secrets.GCHILD_KEY_ALIAS }}
          GCHILD_KEY_PASSWORD: ${{ secrets.GCHILD_KEY_PASSWORD }}
          GCHILD_API_BASE_URL: ${{ vars.GCHILD_API_BASE_URL }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${GCHILD_API_BASE_URL:-}" ]; then
            ARGS+=("-Pgchild.apiBaseUrl=${GCHILD_API_BASE_URL}")
          fi
          if [ -n "${GCHILD_KEYSTORE_BASE64:-}" ] \
            && [ -n "${GCHILD_KEYSTORE_PASSWORD:-}" ] \
            && [ -n "${GCHILD_KEY_ALIAS:-}" ] \
            && [ -n "${GCHILD_KEY_PASSWORD:-}" ]; then
            export GCHILD_KEYSTORE_PATH="$RUNNER_TEMP/gchild-release.jks"
            printf '%s' "$GCHILD_KEYSTORE_BASE64" | base64 -d > "$GCHILD_KEYSTORE_PATH"
            echo "Keystore release tersedia; APK akan ditandatangani."
          else
            echo "Keystore tidak lengkap: APK release dibangun tanpa signing."
          fi
          gradle --no-daemon -p apps/companion-android "${ARGS[@]}" :app:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gchild-companion-release
          path: apps/companion-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
